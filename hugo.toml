baseURL = "https://suyons.github.io/"
locale = "en-us"
title = "suyons blog"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Sooyoung Kim"
  description = "Infrastructure and platform engineer, writing about the systems I build and operate — from air-gapped financial networks to self-hosted home infrastructure, and the hard-won lessons along the way."
  keywords = ["devops", "infrastructure", "docker", "aws", "blog"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Sooyoung Kim"
    Content = "Infrastructure and platform engineer. I've built and run full production systems from scratch — from air-gapped financial networks to self-hosted home infrastructure. Writing about what actually works."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/suyons"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/suyons"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:suyons@pm.me"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    disableHLJS = true

  [params.label]
    text = "suyons blog"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false
